<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trollsite</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      
      .container {
      position: relative;
      height: 100%;
    }
    
      .container_2 {
      position: relative;
      height: 100%;
      }
    }
    
    #playButton {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background-color: red;
      color: #fff;
      font-size: 24px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <script>
     <audio id="container_2" controls autoplay loop width="50%" height="350">
    <source src="audio.mp3" type="audio/mp3">
    Din browser stotter ikke denne type filer.(Gammel skjerm).
     </audio>
  
  <div class="container_2">
    <button id="playButton" onclick="playSound()">Gif for you</button>
    <audio id="sound_3" src="sound.mp3"></audio>
     audio.volume = 1.0;
    audio.play();
    }
  
  </div>
    function playSound() {
      var audio = document.getElementById('sound');
      audio.volume = 1.0;
      audio.play();
    }
  </script>
</body>
</html>
